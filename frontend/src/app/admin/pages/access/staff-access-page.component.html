<section class="relative flex min-h-screen items-center justify-center overflow-hidden bg-white px-4 py-16">
  <div class="pointer-events-none absolute inset-0" aria-hidden="true">
    <div class="absolute -top-24 left-[10%] h-80 w-80 rounded-full bg-pcmazing-100/80 blur-3xl"></div>
    <div class="absolute top-1/3 right-[-6%] h-96 w-96 rounded-full bg-pcmazing-50 blur-3xl"></div>
    <div class="absolute -bottom-20 left-1/3 h-72 w-72 rounded-full bg-sky-100/80 blur-3xl"></div>
  </div>

  <div
    class="relative w-full max-w-md overflow-hidden rounded-3xl border border-white/80 bg-white/40 p-8 shadow-[0_8px_40px_rgba(15,23,42,0.08)] ring-1 ring-white/60 backdrop-blur-2xl"
  >
    <div class="pointer-events-none absolute inset-0 bg-gradient-to-br from-white/80 via-white/20 to-transparent"></div>
    <div class="relative">
      <p class="text-xs font-bold tracking-[0.2em] text-pcmazing-500 uppercase">PCMazing Internal</p>
      <h1 class="mt-3 text-2xl font-bold text-slate-900">Staff Access Verification</h1>
      <p class="mt-2 text-sm leading-relaxed text-slate-500">
        Enter the PCMazing staff passcode to continue to the administrative login page.
      </p>

      @if (notice()) {
        <div class="mt-5 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">
          {{ notice() }}
        </div>
      }

      @if (error()) {
        <div class="mt-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
          {{ error() }}
        </div>
      }

      <form class="mt-6 space-y-5" (ngSubmit)="submit()">
        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700" for="staff-passcode">Staff passcode</label>
          <input
            id="staff-passcode"
            type="password"
            class="w-full rounded-xl border border-white/70 bg-white/55 px-4 py-3 text-sm text-slate-900 shadow-sm backdrop-blur-sm placeholder:text-slate-400 focus:border-pcmazing-500 focus:ring-2 focus:ring-pcmazing-100 focus:outline-none"
            placeholder="Enter staff passcode"
            [ngModel]="passcode()"
            (ngModelChange)="passcode.set($event)"
            name="passcode"
            autocomplete="off"
            required
          />
        </div>

        <button
          type="submit"
          class="inline-flex w-full items-center justify-center rounded-xl bg-pcmazing-500 px-5 py-3 text-sm font-bold tracking-wide text-white hover:bg-pcmazing-600 disabled:cursor-not-allowed disabled:opacity-60"
          [disabled]="loading() || !passcode().trim()"
        >
          {{ loading() ? 'VERIFYING...' : 'CONTINUE TO LOGIN' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        <a routerLink="/" class="font-semibold text-pcmazing-500 hover:text-pcmazing-600">Back to website</a>
      </p>
      <p class="mt-3 text-center text-sm text-slate-500">
        Team member?
        <a routerLink="/user/login" class="font-semibold text-pcmazing-500 hover:text-pcmazing-600">Sign in at MyPeoplePortal</a>
      </p>
    </div>
  </div>
</section>
