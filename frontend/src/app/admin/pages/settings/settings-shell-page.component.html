<section>
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Settings</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
      Manage roles, access, and system tools in one place.
    </p>
  </div>

  <div class="flex flex-col gap-4 lg:flex-row">
    <aside class="w-full shrink-0 lg:w-40">
      <nav class="flex flex-row gap-1 overflow-x-auto rounded-2xl border border-slate-200 bg-white p-1.5 shadow-sm lg:flex-col lg:gap-0.5 lg:overflow-visible dark:border-slate-800 dark:bg-slate-900">
        <a
          routerLink="/admin/settings/roles"
          routerLinkActive="bg-pcmazing-500 text-white"
          class="cursor-pointer rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-600 hover:bg-pcmazing-50 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-pcmazing-500/20 dark:hover:text-white"
        >
          Roles &amp; access
        </a>
        @if (canSee('payroll')) {
          <a
            routerLink="/admin/settings/payroll"
            routerLinkActive="bg-pcmazing-500 text-white"
            class="cursor-pointer rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-600 hover:bg-pcmazing-50 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-pcmazing-500/20 dark:hover:text-white"
          >
            Payroll settings
          </a>
        }
        @if (canSee('printing_generator')) {
          <a
            routerLink="/admin/settings/printing"
            routerLinkActive="bg-pcmazing-500 text-white"
            class="cursor-pointer rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-600 hover:bg-pcmazing-50 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-pcmazing-500/20 dark:hover:text-white"

          </a>
        }
      </nav>
    </aside>

    <div class="min-w-0 flex-1">
      <router-outlet />
    </div>
