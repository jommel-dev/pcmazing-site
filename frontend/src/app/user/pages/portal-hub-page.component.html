<div class="min-h-dvh bg-slate-100 font-outfit text-portal-ink">
  <section
    class="mx-auto flex min-h-dvh w-full max-w-[440px] flex-col bg-portal-page px-6 pt-[calc(2rem+env(safe-area-inset-top))] pb-[calc(1.5rem+env(safe-area-inset-bottom))] sm:border-x sm:border-portal-line sm:shadow-sm"
  >
    <header class="flex flex-col items-center pt-6 text-center">
      <div class="rounded-full bg-portal-halo px-[18px] py-4">
        <img
          src="/images/logopcm.png"
          alt="PCmazing"
          class="h-[56px] w-auto rounded-2xl bg-white object-contain px-3"
        />
      </div>
      <h1 class="mt-6 text-[32px] leading-tight font-bold tracking-[-1.2px]">MyPeoplePortal</h1>
      <p class="mt-2.5 text-[17px] font-semibold">Employee portal</p>
      <p class="mt-2.5 text-sm text-portal-muted">We Build It Better!</p>
    </header>

    <nav class="mt-10 grid gap-3" aria-label="PCmazing apps">
      @for (app of apps; track app.path) {
        <a
          [routerLink]="app.path"
          class="flex items-center gap-3.5 rounded-[20px] border border-portal-line bg-white p-4 focus:outline-none focus-visible:ring-2 focus-visible:ring-portal-blue"
        >
          <span
            class="flex size-12 shrink-0 items-center justify-center rounded-xl bg-portal-halo text-portal-blue"
            aria-hidden="true"
          >
            @switch (app.id) {
              @case ('admin') {
                <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3 4.5 6.5v4.2c0 4.8 3.2 9.1 7.5 10.3 4.3-1.2 7.5-5.5 7.5-10.3V6.5L12 3Z" />
                  <path d="M9.5 12.2 11.2 14l3.5-3.8" />
                </svg>
              }
              @case ('people') {
                <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="9" cy="8" r="3" />
                  <path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5" />
                  <circle cx="17" cy="9" r="2.4" />
                  <path d="M14.2 19c.4-2.2 1.8-3.6 3.8-3.6 1.2 0 2.2.4 3 .1.2" />
                </svg>
              }
            }
          </span>

          <div class="min-w-0 flex-1">
            <h2 class="text-base font-semibold">{{ app.title }}</h2>
            <p class="mt-1 text-[13px] leading-snug text-portal-muted">{{ app.description }}</p>
          </div>

          <span class="shrink-0 text-portal-muted" aria-hidden="true">
            <app-portal-icon name="chevron" [size]="16" />
          </span>
        </a>
      }
    </nav>

    <p class="mt-auto pt-10 text-center text-[13px]">
      <a routerLink="/app-downloads" class="font-semibold text-portal-blue">Download the employee app</a>
    </p>
  </section>
</div>
